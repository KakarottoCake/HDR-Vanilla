<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,height=device-height,user-scalable=no"
    />
    <meta name="focus-ring-visibility" content="hidden" />
    <title>Menu</title>
    <script src="./help/js/jquery-3.3.1.min.js"></script>
    <link rel="stylesheet" href="./menu.css" />
    <link rel="stylesheet" href="./help/css/common.css" />
    <script src="./common/js/wsnd.min.js"></script>
    <script src="./common/js/keyhelp.js"></script>
    <script src="./help/js/common.js"></script>
    <script src="./common.js"></script>
    <script src="./gridmenu.js"></script>
    <script src="./toggles.js"></script>
    <style>
      .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100px;
        line-height: 70px;
        text-align: center;
      }
      .column {
        float: left;
        width: 30%;
        padding: 5px;
      }
      .row:after {
        content: "";
        display: table;
        clear: both;
      }
    </style>
  </head>

  <body>
    <div id="bg"></div>

    <div class="l-header">
      <span class="background-clip"></span>
      <div class="header">
        <a
          id="ret-button"
          tabindex="-1"
          class="header-decoration"
          href="http://localhost/"
          nx-se-disabled=""
        >
          <div class="ret-icon-wrapper">
            <img
              class="ret-icon-shadow"
              ref="./help/img/icon/m_retnormal.svg"
            />
            <img class="ret-icon" ref="./help/img/icon/m_retnormal.svg" />
          </div>
        </a>
        <div class="breadcrumb-list f-u-bold">
          <p>
            <span
              data-msgcom="true"
              data-msgid="textbox_id-10002"
              style="
                color: rgb(255, 255, 255);
                -webkit-text-stroke-width: 2px;
                -webkit-text-stroke-color: black;
                z-index: 1;
              "
              id="test"
              >Custom Game Modes</span
            >
          </p>
        </div>
      </div>
    </div>

    <div class="main" id="list">
      <div class="flex-container">
        <div class="row">
          <div class="column">
            <button
              id="gamemode-cycle-button"
              onclick="cycleGameMode('gamemode-cycle-icon')"
              onfocus="textFocus('Click to toggle various alternate system mechanics!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="gamemode-cycle-icon"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Select Game Mode</h2>
              </div>
            </button>

            <button
              onclick="toggle('tag', this, 'tag')"
              onfocus="textFocus('A random player starts with the final smash aura! Hit other players to pass it on.\nOnce time runs out, you die!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="tag"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Tag Mode</h2>
              </div>
            </button>

            <button
              onclick="toggle('turbo', this, 'turbo')"
              onfocus="textFocus('Cancel your attacks into each other with no restrictions!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="turbo"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Turbo Mode</h2>
              </div>
            </button>

            <button
              onclick="toggle('magicseries', this, 'magicseries')"
              onfocus="textFocus('Cancel your attacks in order of rising strength!\nJabs & Dash Attack --> Tilts --> Smashes & Aerials --> Specials!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="magicseries"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Magic Series Mode</h2>
              </div>
            </button>

            <button
              onclick="toggle('hitfall', this, 'hitfall')"
              onfocus="textFocus('Players can immediately fastfall during hitlag, even while rising.\nUse this tech to land quickly and chain aerial attacks!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="hitfall"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Hitfall Mode</h2>
              </div>
            </button>
          </div>
          <div class="column">
            <button
              onclick="toggle('airdash', this, 'airdash')"
              onfocus="textFocus('Replaces your airdodge with an omnidirectional airdash!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="airdash"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Airdash Mode</h2>
              </div>
            </button>

            <button
              onclick="toggle('element', this, 'element')"
              onfocus="textFocus('Every attack has a chance for a random effect! Will it be a simple visual change?\nMaybe something crazier? Who knows? Embrace pure chaos!')"
              class="flex-item"
              style="width: 100%"
            >
              <div class="icon-background">
                <img
                  id="element"
                  class="abstract-icon is-appear"
                  style="display: none"
                  src="check.svg"
                />
              </div>
              <div class="item-container">
                <h2>Element Mode</h2>
              </div>
            </button>
          </div>
        </div>
        <button
          onclick="saveAndExit()"
          onfocus="textFocus('')"
          class="flex-item"
          style="width: 91.8%; margin-left: 6px"
        >
          <div class="icon-background"></div>
          <div class="item-container">
            <h2>Play!</h2>
          </div>
        </button>
      </div>
      <div class="footer">
        <hr />
        <h2 id="focus-text"></h2>
      </div>
    </div>
  </body>
</html>
